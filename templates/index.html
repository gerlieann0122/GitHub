<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            background: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .search-box button {
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: bold;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-box button:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        .units-toggle {
            text-align: center;
            margin-bottom: 20px;
        }

        .units-toggle button {
            padding: 10px 20px;
            margin: 0 5px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .units-toggle button.active {
            background: white;
            color: #667eea;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .weather-card.loading {
            text-align: center;
            padding: 60px 40px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .city-name {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 3.5em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .description {
            font-size: 1.2em;
            color: #666;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .detail {
            text-align: center;
        }

        .detail-label {
            font-size: 0.9em;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .error-close {
            float: right;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }

            .temperature {
                font-size: 2.5em;
            }

            .weather-card {
                padding: 30px 20px;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information</p>
        </div>

        <div class="units-toggle">
            <button class="unit-btn active" data-unit="metric">°C (Celsius)</button>
            <button class="unit-btn" data-unit="imperial">°F (Fahrenheit)</button>
        </div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." value="London">
            <button onclick="searchWeather()">Search</button>
        </div>

        <div id="error" class="error" style="display: none;">
            <span id="errorText"></span>
            <span class="error-close" onclick="closeError()">&times;</span>
        </div>

        <div class="weather-card" id="weatherCard">
            <div class="loading">
                <div class="loader"></div>
                <p style="margin-top: 20px; color: #999;">Loading weather data...</p>
            </div>
        </div>
    </div>

    <script>
        let currentUnit = 'metric';

        // Load weather on page load
        window.addEventListener('load', () => {
            searchWeather('London');
        });

        // Unit toggle
        document.querySelectorAll('.unit-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentUnit = e.target.dataset.unit;
                searchWeather(document.getElementById('cityInput').value);
            });
        });

        // Search on Enter key
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        function searchWeather(city = null) {
            const cityInput = document.getElementById('cityInput');
            const searchCity = city || cityInput.value || 'London';
            const weatherCard = document.getElementById('weatherCard');

            // Show loading state
            weatherCard.innerHTML = '<div class="loading"><div class="loader"></div><p style="margin-top: 20px; color: #999;">Loading weather for ' + searchCity + '...</p></div>';

            // Fetch weather data
            fetch(`/api/weather?city=${encodeURIComponent(searchCity)}&units=${currentUnit}`)
                .then(response => {
                    if (!response.ok) throw new Error('Weather not found');
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        displayWeather(data);
                        closeError();
                    } else {
                        showError('Failed to fetch weather data');
                    }
                })
                .catch(error => {
                    showError(error.message || 'Failed to fetch weather data');
                    console.error('Error:', error);
                });
        }

        function displayWeather(data) {
            const unit = currentUnit === 'metric' ? '°C' : '°F';
            const windUnit = currentUnit === 'metric' ? 'm/s' : 'mph';

            const html = `
                <div class="city-name">${data.city}</div>
                <div class="temperature">${Math.round(data.temperature)}${unit}</div>
                <div class="description">${data.description}</div>

                <div class="weather-details">
                    <div class="detail">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value">${Math.round(data.data.main.feels_like)}${unit}</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value">${data.humidity}%</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value">${data.pressure} hPa</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value">${data.wind_speed} ${windUnit}</div>
                    </div>
                </div>
            `;

            document.getElementById('weatherCard').innerHTML = html;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            document.getElementById('errorText').textContent = message;
            errorDiv.style.display = 'block';
        }

        function closeError() {
            document.getElementById('error').style.display = 'none';
        }
    </script>
</body>
</html>
